name: Update OCP Version Nightly
on:
  schedule:
    - cron: '0 4 * * *' # Every day at 4am UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: read-all

jobs:
  update-ocp-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check Red Hat Status
        uses: palmsoftware/redhat-status@v0
        with:
          components: |
            api.openshift.com

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get latest OCP GA release level
        id: get_ocp_version
        run: |
          # The client-tools mirror can lag the upgrade graph by hours or days.
          # Only a release level whose mirror directory exists is usable:
          # scripts/install-oc-tools.sh fetches release.txt from
          # https://mirror.openshift.com/pub/openshift-v4/<arch>/clients/ocp/latest-<X.Y>/release.txt
          # Selecting a level early fails every cluster job in CI (see #508).
          mirror_publishes() {
            local version=$1
            local arch url
            for arch in x86_64 arm64; do
              url="https://mirror.openshift.com/pub/openshift-v4/${arch}/clients/ocp/latest-${version}/release.txt"
              if ! curl -fsS --max-time 20 --retry 3 --retry-delay 5 -o /dev/null "$url"; then
                echo "Mirror has not published ${version} for ${arch} yet" >&2
                return 1
              fi
            done
            return 0
          }

          # Scan upward from current version to find the latest GA channel
          # that the mirror has published.
          # Handles the 4.22 -> 5.0 major version transition.
          find_latest_ocp_version() {
            local current
            current=$(sed -n "/^  ocpReleaseLevel:/,/^  [a-zA-Z]/p" action.yml | grep -o "default: '[^']*'" | sed "s/default: '\(.*\)'/\1/")
            if [ -z "$current" ]; then
              echo "Error: Could not parse ocpReleaseLevel from action.yml" >&2
              return 1
            fi
            local current_major=${current%%.*}
            local current_minor=${current##*.}

            echo "Current version in action.yml: ${current}" >&2
            local latest="$current"

            for major in $current_major $((current_major + 1)); do
              local start_minor=0
              if [ "$major" -eq "$current_major" ]; then
                start_minor=$((current_minor + 1))
              fi

              for minor in $(seq $start_minor $((start_minor + 5))); do
                local channel="stable-${major}.${minor}"
                echo "Checking ${channel}..." >&2

                local node_count
                node_count=$(curl -s --max-time 10 \
                  "https://api.openshift.com/api/upgrades_info/v1/graph?channel=${channel}&arch=amd64" 2>/dev/null \
                  | jq '.nodes | length' 2>/dev/null || echo "0")

                if [ "$node_count" -gt 0 ]; then
                  echo "Found GA channel: ${channel} with ${node_count} versions" >&2
                  if mirror_publishes "${major}.${minor}"; then
                    latest="${major}.${minor}"
                  else
                    echo "Skipping ${major}.${minor}: GA channel exists but the client-tools mirror does not" >&2
                  fi
                else
                  echo "No versions in ${channel}, stopping scan for ${major}.x" >&2
                  break
                fi
              done
            done

            echo "$latest"
          }

          version=$(find_latest_ocp_version)
          if [ $? -ne 0 ] || [ -z "$version" ]; then
            echo "Error: Could not determine latest OCP GA version"
            exit 1
          fi

          # Validate format (major.minor only)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format '$version' - expected major.minor"
            exit 1
          fi

          echo "Successfully determined latest OCP GA version: $version"
          echo "ocp_version=$version" >> $GITHUB_OUTPUT

      - name: Update default ocpReleaseLevel in action.yml
        id: update_version
        run: |
          version=${{ steps.get_ocp_version.outputs.ocp_version }}

          # Double-check the version is valid before updating
          if [ -z "$version" ] || [ "$version" = "null" ] || ! [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid OCP version '$version' - aborting update"
            exit 1
          fi

          echo "Updating OCP release level to: $version"

          # Extract current default under the ocpReleaseLevel block
          current_version=$(sed -n "/^  ocpReleaseLevel:$/,/^  [a-zA-Z]\+:/p" action.yml | grep -o "default: '[^']*'" | sed "s/default: '\(.*\)'/\1/")

          if [ -z "$current_version" ]; then
            echo "Could not determine current OCP release level from action.yml"
            exit 1
          fi

          if ! ./scripts/is-version-newer.sh "$current_version" "$version"; then
            echo "OCP candidate $version is not newer than current release level $current_version"
            echo "updated=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Update only within the ocpReleaseLevel block
          sed -i.bak -E "/^  ocpReleaseLevel:$/,/^  [a-zA-Z]+:/{s/(default: ')[^']+(')/\1$version\2/}" action.yml
          rm action.yml.bak

          echo "Successfully updated OCP release level from $current_version to $version"
          echo "updated=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.update_version.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "Update OCP release level to ${{ steps.get_ocp_version.outputs.ocp_version }}"
          title: "Update OCP release level to ${{ steps.get_ocp_version.outputs.ocp_version }}"
          body: "Automated PR to update default ocpReleaseLevel in action.yml to the latest GA release."
          branch: "update-ocp-version-${{ steps.get_ocp_version.outputs.ocp_version }}"
          delete-branch: true
