name: Update OLM Version Nightly
on:
  schedule:
    - cron: '0 2 * * *' # Every day at 2am UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: read-all

jobs:
  update-olm-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get highest stable OLM release version
        id: get_olm_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Function to get OLM version with retries
          get_olm_version() {
            local retries=3
            local delay=5

            for ((i=1; i<=retries; i++)); do
              echo "Attempt $i to fetch OLM version..."

              all_tags=""
              page=1
              while :; do
                response=$(curl -sS --max-time 30 -H "Authorization: Bearer $GITHUB_TOKEN" \
                  "https://api.github.com/repos/operator-framework/operator-lifecycle-manager/releases?per_page=100&page=$page") || response=""

                if [ -z "$response" ] || ! echo "$response" | jq -e 'type == "array"' >/dev/null 2>&1; then
                  echo "API call failed or returned an invalid response on page $page"
                  all_tags=""
                  break
                fi

                page_tags=$(echo "$response" | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name // empty')
                all_tags+="$page_tags"$'\n'

                release_count=$(echo "$response" | jq 'length')
                if [ "$release_count" -lt 100 ]; then
                  break
                fi
                page=$((page + 1))
              done

              version=$(printf '%s' "$all_tags" | ./scripts/select-highest-version.sh '^v[0-9]+\.[0-9]+\.[0-9]+$')

              if [ -n "$version" ]; then
                echo "Successfully selected highest stable OLM version: $version"
                echo "olm_version=$version" >> $GITHUB_OUTPUT
                return 0
              fi

              echo "No stable OLM release matching the expected version format was found"

              if [ $i -lt $retries ]; then
                echo "Retrying in $delay seconds..."
                sleep $delay
              fi
            done

            echo "Failed to fetch valid OLM version after $retries attempts"
            exit 1
          }

          get_olm_version

      - name: Update OLM version in action.yml
        id: update_version
        run: |
          version=${{ steps.get_olm_version.outputs.olm_version }}

          # Double-check the version is valid before updating
          if [ -z "$version" ] || [ "$version" = "null" ] || ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid OLM version '$version' - aborting update"
            exit 1
          fi

          echo "Updating OLM version to: $version"

          # Check if the version is already current
          current_version=$(grep -A2 "olmVersion:" action.yml | grep "default:" | sed "s/.*default: *'\(.*\)'/\1/")
          if ! ./scripts/is-version-newer.sh "$current_version" "$version"; then
            echo "OLM candidate $version is not newer than current version $current_version"
            echo "updated=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Update the default version in action.yml olmVersion input
          sed -i.bak -E "/^  olmVersion:/,/^  [a-zA-Z]/ s/(default: ').*(')$/\1$version\2/" action.yml
          rm action.yml.bak

          echo "Successfully updated OLM version from $current_version to $version"
          echo "updated=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.update_version.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "Update OLM version to ${{ steps.get_olm_version.outputs.olm_version }}"
          title: "Update OLM version to ${{ steps.get_olm_version.outputs.olm_version }}"
          body: "Automated PR to update OLM version in action.yml to the latest release."
          branch: "update-olm-version-${{ steps.get_olm_version.outputs.olm_version }}"
          delete-branch: true
