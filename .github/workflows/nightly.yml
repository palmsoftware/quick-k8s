---
name: Nightly Comprehensive Tests

on:
  schedule:
    - cron: '0 0 * * *'  # Run at midnight UTC daily
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: read-all

jobs:
  # Basic cluster tests with different providers and OS versions
  basic-cluster-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
        provider: [kind, minikube]
    runs-on: ${{ matrix.os }}
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run the action with ${{ matrix.provider }}
        uses: ./
        with:
          clusterProvider: ${{ matrix.provider }}
          disableDefaultCni: true
          waitForPodsReady: true

      - name: Verify cluster is operational
        run: |
          kubectl get nodes
          kubectl get pods -A
          kubectl cluster-info

  # Multi-node cluster tests
  multi-node-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        provider: [kind, minikube]
        nodes:
          - controlPlane: 1
            workers: 2
          - controlPlane: 1
            workers: 3
    runs-on: ${{ matrix.os }}
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with multiple nodes
        uses: ./
        with:
          clusterProvider: ${{ matrix.provider }}
          numControlPlaneNodes: ${{ matrix.nodes.controlPlane }}
          numWorkerNodes: ${{ matrix.nodes.workers }}
          disableDefaultCni: true
          waitForPodsReady: true

      - name: Verify node count
        run: |
          NODE_COUNT=$(kubectl get nodes --no-headers | wc -l)
          EXPECTED_COUNT=$((${{ matrix.nodes.controlPlane }} + ${{ matrix.nodes.workers }}))
          if [ "$NODE_COUNT" -ne "$EXPECTED_COUNT" ]; then
            echo "Expected $EXPECTED_COUNT nodes, found $NODE_COUNT"
            exit 1
          fi
          kubectl get nodes

  # OLM installation tests
  olm-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        provider: [kind, minikube]
    runs-on: ${{ matrix.os }}
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with OLM
        uses: ./
        with:
          clusterProvider: ${{ matrix.provider }}
          installOLM: true
          waitForPodsReady: true

      - name: Verify OLM installation
        run: |
          kubectl get crds | grep operators.coreos.com
          kubectl get pods -n olm
          kubectl get catalogsource -n olm

  # Istio installation tests
  istio-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        provider: [kind, minikube]
        istio-profile: [minimal, demo, default]
        exclude:
          - provider: minikube
            istio-profile: demo
          - provider: minikube
            istio-profile: default
    runs-on: ${{ matrix.os }}
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with Istio
        uses: ./
        with:
          clusterProvider: ${{ matrix.provider }}
          installIstio: true
          istioProfile: ${{ matrix.istio-profile }}
          waitForPodsReady: true

      - name: Verify Istio installation
        run: |
          kubectl get namespace istio-system
          kubectl get pods -n istio-system
          istioctl version
          # Verify Istio installation by checking if pods are running
          kubectl wait --for=condition=ready pod --all -n istio-system --timeout=300s

  # Combined features tests (OLM + Istio)
  combined-features-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        provider: [kind, minikube]
    runs-on: ${{ matrix.os }}
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with all features
        uses: ./
        with:
          clusterProvider: ${{ matrix.provider }}
          installOLM: true
          installIstio: true
          istioProfile: minimal
          removeDefaultStorageClass: true
          removeControlPlaneTaint: true
          waitForPodsReady: true

      - name: Verify all features
        run: |
          echo "=== Cluster Info ==="
          kubectl get nodes
          kubectl get pods -A

          echo "=== OLM Verification ==="
          kubectl get crds | grep operators.coreos.com
          kubectl get pods -n olm

          echo "=== Istio Verification ==="
          kubectl get pods -n istio-system
          istioctl version

          echo "=== Storage Class Verification ==="
          kubectl get storageclass

  # Cluster monitoring tests (Prometheus + Thanos)
  monitoring-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        provider: [kind, minikube]
    runs-on: ${{ matrix.os }}
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with cluster monitoring
        uses: ./
        with:
          clusterProvider: ${{ matrix.provider }}
          enableClusterMonitoring: true
          waitForPodsReady: true

      - name: Verify monitoring stack
        run: |
          echo "=== Monitoring Namespace ==="
          kubectl get namespace monitoring

          echo "=== Prometheus Verification ==="
          kubectl get pods -n monitoring
          kubectl get prometheus -n monitoring
          kubectl get alertmanager -n monitoring
          kubectl get crd | grep monitoring.coreos.com

          echo "=== Thanos Verification ==="
          kubectl get pods -n monitoring -l app.kubernetes.io/name=thanos-query
          kubectl get pods -n monitoring -l app.kubernetes.io/name=prometheus -o jsonpath='{.items[*].spec.containers[*].name}' | tr ' ' '\n' | grep thanos

  # CNI plugin tests across OS matrix
  cilium-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        provider: [kind, minikube]
    runs-on: ${{ matrix.os }}
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with Cilium (${{ matrix.provider }})
        uses: ./
        with:
          clusterProvider: ${{ matrix.provider }}
          cniPlugin: cilium
          waitForPodsReady: true

      - name: Verify Cilium
        run: |
          kubectl get pods -n kube-system -l k8s-app=cilium
          kubectl wait --for=condition=ready pod -l k8s-app=cilium -n kube-system --timeout=120s
          cilium status

  # Component installation tests across OS matrix
  cert-manager-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
        provider: [kind, minikube]
    runs-on: ${{ matrix.os }}
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with cert-manager (${{ matrix.provider }})
        uses: ./
        with:
          clusterProvider: ${{ matrix.provider }}
          installCertManager: true
          waitForPodsReady: true

      - name: Verify cert-manager
        run: |
          kubectl get namespace cert-manager
          kubectl wait --for=condition=ready pod --all -n cert-manager --timeout=60s
          kubectl get crd | grep cert-manager

  ingress-nginx-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
        provider: [kind, minikube]
    runs-on: ${{ matrix.os }}
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with ingress-nginx (${{ matrix.provider }})
        uses: ./
        with:
          clusterProvider: ${{ matrix.provider }}
          installIngressNginx: true
          waitForPodsReady: true

      - name: Verify ingress-nginx
        run: |
          kubectl get namespace ingress-nginx
          kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=60s
          kubectl get ingressclass

  metrics-server-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
        provider: [kind, minikube]
    runs-on: ${{ matrix.os }}
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with metrics-server (${{ matrix.provider }})
        uses: ./
        with:
          clusterProvider: ${{ matrix.provider }}
          installMetricsServer: true
          waitForPodsReady: true

      - name: Verify metrics-server
        run: |
          kubectl get pods -n kube-system -l k8s-app=metrics-server
          sleep 30
          kubectl top nodes || echo "Metrics may need more time to populate"

  operator-sdk-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
        provider: [kind, minikube]
    runs-on: ${{ matrix.os }}
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with operator-sdk (${{ matrix.provider }})
        uses: ./
        with:
          clusterProvider: ${{ matrix.provider }}
          installOperatorSdk: true
          waitForPodsReady: true

      - name: Verify operator-sdk
        run: operator-sdk version

  local-registry-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
        provider: [kind, minikube]
    runs-on: ${{ matrix.os }}
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with local registry
        uses: ./
        with:
          clusterProvider: ${{ matrix.provider }}
          installLocalRegistry: true
          localRegistryPort: 5001
          waitForPodsReady: true

      - name: Verify local registry
        run: |
          docker ps | grep quick-k8s-registry
          curl -s http://localhost:5001/v2/ || exit 1
          docker pull busybox:latest
          docker tag busybox:latest localhost:5001/test-image:latest
          docker push localhost:5001/test-image:latest

  # Different Kubernetes versions test (KinD only as it supports explicit versions easily)
  kubernetes-versions-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        k8s-version:
          - 'kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95'
          - 'kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256'
    runs-on: ${{ matrix.os }}
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with specific K8s version
        uses: ./
        with:
          clusterProvider: kind
          defaultNodeImage: ${{ matrix.k8s-version }}
          waitForPodsReady: true

      - name: Verify Kubernetes version
        run: |
          kubectl version
          kubectl get nodes -o wide

  # Minikube driver tests
  minikube-driver-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        driver: [docker, podman]
    runs-on: ${{ matrix.os }}
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with Minikube driver
        uses: ./
        with:
          clusterProvider: minikube
          minikubeDriver: ${{ matrix.driver }}
          waitForPodsReady: true

      - name: Verify Minikube driver
        run: |
          minikube profile list
          kubectl get nodes

  # IP family tests
  ip-family-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        provider: [kind]
        ip-family: [dual, ipv4]
    runs-on: ${{ matrix.os }}
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with IP family
        uses: ./
        with:
          clusterProvider: ${{ matrix.provider }}
          ipFamily: ${{ matrix.ip-family }}
          waitForPodsReady: true

      - name: Verify IP configuration
        run: |
          kubectl get nodes -o wide
          kubectl get pods -A -o wide

  # Dry run test - verify no cluster is created
  dry-run-test:
    runs-on: ubuntu-24.04
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action in dry run mode
        uses: ./
        with:
          clusterProvider: kind
          dryRun: true

      - name: Verify no cluster was created
        run: |
          if command -v kubectl &>/dev/null && kubectl cluster-info &>/dev/null 2>&1; then
            echo "ERROR: Cluster should not exist in dry run mode"
            exit 1
          fi
          echo "Dry run test passed - no cluster created"

  # Cleanup script test
  cleanup-script-test:
    runs-on: ubuntu-24.04
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with cleanup enabled
        uses: ./
        with:
          clusterProvider: kind
          enableCleanup: true
          waitForPodsReady: true

      - name: Verify cleanup script was created
        run: |
          if [ ! -f /tmp/quick-k8s-cleanup.sh ]; then
            echo "ERROR: Cleanup script not found at /tmp/quick-k8s-cleanup.sh"
            exit 1
          fi
          echo "Cleanup script found"

      - name: Run cleanup script
        run: |
          chmod +x /tmp/quick-k8s-cleanup.sh
          /tmp/quick-k8s-cleanup.sh
          echo "Cleanup script executed successfully"

      - name: Verify cluster was cleaned up
        run: |
          if kind get clusters 2>/dev/null | grep -q kind; then
            echo "ERROR: Cluster still exists after cleanup"
            exit 1
          fi
          echo "Cleanup test passed - cluster removed"

  # Persistent volumes test
  persistent-volumes-test:
    runs-on: ubuntu-24.04
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with persistent volumes
        uses: ./
        with:
          clusterProvider: kind
          createPersistentVolumes: true
          persistentVolumeCount: 3
          persistentVolumeSize: 5Gi
          waitForPodsReady: true

      - name: Verify persistent volumes
        run: |
          PV_COUNT=$(kubectl get pv --no-headers | wc -l)
          if [ "$PV_COUNT" -ne 3 ]; then
            echo "ERROR: Expected 3 PVs, found $PV_COUNT"
            exit 1
          fi
          kubectl get pv
          echo "Persistent volumes test passed"

  # Node taints test
  node-taints-test:
    runs-on: ubuntu-24.04
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with taints
        uses: ./
        with:
          clusterProvider: kind
          numWorkerNodes: 1
          controlPlaneTaints: "custom-taint=true:NoSchedule"
          workerNodeTaints: "worker-taint=true:NoSchedule"
          waitForPodsReady: true

      - name: Verify taints applied
        run: |
          echo "Checking control plane taints..."
          kubectl get nodes -l node-role.kubernetes.io/control-plane -o jsonpath='{.items[*].spec.taints}' | grep -q custom-taint
          echo "Control plane taint verified"
          echo "Checking worker taints..."
          kubectl get nodes -l '!node-role.kubernetes.io/control-plane' -o jsonpath='{.items[*].spec.taints}' | grep -q worker-taint
          echo "Worker taint verified"
          echo "Node taints test passed"

  # Skip disk cleanup test
  skip-disk-cleanup-test:
    runs-on: ubuntu-24.04
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with skipDiskCleanup
        uses: ./
        with:
          clusterProvider: kind
          skipDiskCleanup: true
          waitForPodsReady: true

      - name: Verify cluster is operational
        run: |
          kubectl get nodes
          kubectl get pods -A
          echo "Skip disk cleanup test passed"

  # Extra port mappings test (auto-generated config, not custom config)
  extra-port-mappings-test:
    runs-on: ubuntu-24.04
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with extra port mappings
        uses: ./
        with:
          clusterProvider: kind
          extraPortMappings: "30000:30000,30001:30001"
          waitForPodsReady: true

      - name: Verify port mappings
        run: |
          docker inspect kind-control-plane --format '{{ json .HostConfig.PortBindings }}' | grep -q 30000
          echo "Extra port mappings test passed"

  # IPv6 test (known to be unstable on GitHub Actions runners)
  ipv6-test:
    runs-on: ubuntu-24.04
    env:
      SHELL: /bin/bash
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Run action with IPv6
        uses: ./
        with:
          clusterProvider: kind
          ipFamily: ipv6
          waitForPodsReady: true

      - name: Verify IPv6 configuration
        run: |
          kubectl get nodes -o wide
          kubectl get pods -A -o wide
          echo "IPv6 test passed"

